name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Android Project
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/mihirgupta0900/tvhome
          
          cat << 'EOF' > settings.gradle
          rootProject.name = "tv-home"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mihirgupta0900.tvhome'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mihirgupta0900.tvhome"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application android:label="TV Home">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/mihirgupta0900/tvhome/MainActivity.java
          package com.mihirgupta0900.tvhome;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  finish();
              }
          }
          EOF

      - name: Inject My Apps
        run: |
          cat << 'EOF' > app/src/main/res/values/config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="dock_apps">
                  <item>tv.flesli.ott</item>
                  <item>com.smartdeviceltd.itv</item>
                  <item>com.lagom.vpn</item>
                  <item>com.android.vending</item>
                  <item>ru.rutube.tv</item>
                  <item>com.google.android.youtube.tv</item>
                  <item>ru.ivi.client.tv</item>
                  <item>ru.mts.mtstv</item>
                  <item>ru.kinopoisk.hd.tv</item>
                  <item>com.adguard.vpn</item>
                  <item>com.softanb.hittv</item>
                  <item>com.vk.vkvideo.tv</item>
                  <item>com.uptodown.tv</item>
              </string-array>
              <string-array name="hidden_apps"></string-array>
              <string name="live_tv_app">com.android.tv.livetv</string>
              <integer name="grid_columns">6</integer>
          </resources>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-launcher
          path: app/build/outputs/apk/release/*.apk

